name: Build

# Needed so the release-attach step can create/update GitHub releases
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: AllInOneSnapchatDownloader-windows
            artifact_path: dist/AllInOneSnapchatDownloader.exe
          # PyInstaller only builds for the architecture of the runner it's on
          # (no cross-compiling, no fat/universal2 binary), so Intel and Apple
          # Silicon Macs each need their own build or the other arch gets
          # "app is not supported on this Mac" when double-clicked.
          - os: macos-15-intel
            artifact_name: AllInOneSnapchatDownloader-macos-intel
            numpy_platform: macosx_10_13_x86_64
            artifact_path: dist/AllInOneSnapchatDownloader-macos-intel.zip
          - os: macos-latest
            artifact_name: AllInOneSnapchatDownloader-macos-arm64
            numpy_platform: macosx_11_0_arm64
            artifact_path: dist/AllInOneSnapchatDownloader-macos-arm64.zip
          - os: ubuntu-latest
            artifact_name: AllInOneSnapchatDownloader-linux
            artifact_path: dist/AllInOneSnapchatDownloader-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tk shared libraries needed so the bundled tkinter can load. The runner
      # image usually ships them already, so only hit apt when tkinter can't
      # load - and retry, since Ubuntu mirrors intermittently fail DNS.
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          if python -c "import tkinter; tkinter.Tcl()" 2>/dev/null; then
            echo "tkinter already works - skipping apt"
            exit 0
          fi
          for i in 1 2 3 4; do
            sudo apt-get update -o Acquire::Retries=3 && \
              sudo apt-get install -y -o Acquire::Retries=3 python3-tk && break
            echo "apt attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          python -c "import tkinter; tkinter.Tcl(); print('tkinter OK')"

      # numpy publishes both an old-macOS wheel and a macOS 14+ (Accelerate)
      # wheel; pip picks the newest tag the runner supports, so the app then
      # crashes on import for users on macOS 11-13 ("Symbol not found:
      # ____chkstk_darwin"), silently disabling timezone/GPS support. Install
      # the low-deployment-target wheel explicitly.
      - name: Install numpy for older macOS
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          python -m pip download numpy --no-deps --only-binary=:all: --platform ${{ matrix.numpy_platform }} --python-version 3.12 -d numpy_wheel
          pip install numpy_wheel/numpy-*.whl

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --clean AllInOneSnapchatDownloader.spec

      # Zip/tar the Mac and Linux outputs so executable permissions survive
      # artifact upload (upload-artifact does not preserve the exec bit).
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/AllInOneSnapchatDownloader.app "dist/${{ matrix.artifact_name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf dist/AllInOneSnapchatDownloader-linux.tar.gz -C dist AllInOneSnapchatDownloader

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
